
name: Update profile stats

on:
  schedule:
    - cron: "0 3 * * *"

  push:
    paths:
      - ".github/workflows/streak-stats.yml"
      - "scripts/generate-languages.mjs"

  workflow_dispatch:

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&background=0D1117&stroke=30363D&ring=D96C86&fire=F4ACB7&currStreakNum=F0F6FC&sideNums=F0F6FC&currStreakLabel=F4ACB7&sideLabels=C9D1D9&dates=8B949E&timezone=Asia/Manila&disable_animations=true
          path: profile/streak.svg

      - name: Generate language stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-languages.mjs

      - name: Commit profile stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/streak.svg profile/languages.svg

          if git diff --cached --quiet; then
            echo "No changes to the profile stats."
            exit 0
          fi

          git commit -m "Update profile stats"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
