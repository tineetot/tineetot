
name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

# Prevent overlapping runs from pushing at the same time.
concurrency:
  group: update-streak-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&background=FFF7F5&stroke=F4ACB7&ring=D96C86&fire=D96C86&currStreakNum=702B42&sideNums=702B42&currStreakLabel=702B42&sideLabels=702B42&dates=B76E79&timezone=Asia/Manila&disable_animations=true
          path: profile/streak.svg

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/streak.svg

          if git diff --cached --quiet; then
            echo "No changes to the streak image."
            exit 0
          fi

          git commit -m "Update streak stats"

          # Sync with the latest remote changes before pushing.
          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
